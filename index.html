<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Behind the Veil of Ignorance - Identity Lottery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
    }
    .card-pop {
      animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      0% { opacity: 0; transform: translateY(12px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-4 sm:p-6">

  <div class="w-full max-w-2xl bg-slate-900/90 border border-slate-700/80 rounded-3xl shadow-2xl overflow-hidden">
    <!-- Top Header -->
    <header class="bg-indigo-950/80 border-b border-indigo-800/50 px-6 py-4 flex items-center justify-between">
      <div>
        <span class="text-xs font-bold uppercase tracking-wider text-indigo-300">Grade 3 English &times; UN SDGs</span>
        <h1 class="text-lg sm:text-xl font-extrabold text-white">Behind the Veil of Ignorance</h1>
      </div>
      <div id="scoreBadge" class="hidden bg-slate-800 border border-slate-600 px-3.5 py-1.5 rounded-full text-sm font-bold">
        Score: <span id="currentScoreText" class="text-emerald-400">100</span> pts
      </div>
    </header>

    <!-- SCREEN 1: INTRO & IDENTITY DRAW -->
    <section id="screenIntro" class="p-6 sm:p-8 text-center card-pop">
      <div class="inline-block bg-indigo-500/20 text-indigo-300 text-xs font-semibold px-3 py-1 rounded-full mb-3">
        Step 1. Identity Lottery (신분 뽑기)
      </div>
      <h2 class="text-2xl sm:text-3xl font-extrabold mb-3">태어나기 전, 무지의 베일 뒤에서</h2>
      <p class="text-slate-300 text-sm sm:text-base leading-relaxed mb-6">
        당신은 내일 새로운 세상에서 태어납니다.<br/>
        버튼을 눌러 <strong>6가지 삶의 조건(나이·성별·출신·경제력·건강·주거)</strong>을 무작위로 뽑아보세요!
      </p>

      <div id="identityGrid" class="hidden grid-cols-2 sm:grid-cols-3 gap-3 text-left mb-6"></div>

      <button id="drawBtn" onclick="drawIdentity()"
        class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition text-white font-bold px-8 py-4 rounded-2xl shadow-lg shadow-indigo-600/30 text-base">
        🎲 내 신분 카드 뽑기 (Draw My Identity)
      </button>

      <button id="startSimBtn" onclick="startSimulation()"
        class="hidden w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-white font-bold px-8 py-4 rounded-2xl shadow-lg shadow-emerald-600/30 text-base mt-2">
        8가지 현실 위기 체험 시작하기 &rarr;
      </button>
    </section>

    <!-- SCREEN 2: 8 CRISIS SITUATIONS -->
    <section id="screenSim" class="hidden p-6 sm:p-8 card-pop">
      <!-- Mini Identity Summary Bar -->
      <div id="miniProfile" class="flex flex-wrap gap-1.5 mb-5 pb-4 border-b border-slate-800 text-xs"></div>

      <!-- Progress -->
      <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
        <span id="stepCounter" class="font-bold text-indigo-300">Situation 1 / 8</span>
        <span>Starting Score: 100 pts</span>
      </div>
      <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-6">
        <div id="progressBar" class="bg-indigo-500 h-full transition-all duration-300" style="width: 12.5%"></div>
      </div>

      <!-- Situation Card -->
      <div id="situationBox" class="bg-slate-800/80 border border-slate-700 rounded-2xl p-5 sm:p-6 mb-6">
        <div class="flex items-center gap-2.5 mb-2">
          <span id="sitIcon" class="text-2xl">🌧️</span>
          <div>
            <h3 id="sitTitleEn" class="text-lg font-extrabold text-white"></h3>
            <p id="sitTitleKo" class="text-xs text-indigo-300 font-semibold"></p>
          </div>
        </div>
        <p id="sitPrompt" class="text-slate-300 text-sm mb-4 leading-relaxed"></p>

        <!-- Outcome Box -->
        <div id="outcomeBox" class="rounded-xl p-4 border">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold uppercase tracking-wider opacity-80">Result for Your Persona</span>
            <span id="sitDelta" class="text-sm font-extrabold px-2.5 py-0.5 rounded-full"></span>
          </div>
          <p id="sitDescEn" class="text-sm sm:text-base font-bold text-white mb-1"></p>
          <p id="sitDescKo" class="text-xs sm:text-sm text-slate-200/90"></p>
        </div>
      </div>

      <button id="nextSitBtn" onclick="nextSituation()"
        class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition text-white font-bold py-3.5 rounded-2xl text-base">
        다음 상황 보기 (Next Situation) &rarr;
